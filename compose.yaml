services:
  beso:
    build:
      context: .
      target: runtime
    image: beso-lab:local
    ports:
      - "${BESO_BIND_ADDRESS:-127.0.0.1}:${BESO_PORT:-5080}:8080"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    cpus: 2
    pids_limit: 256
    stop_grace_period: 30s
